apiVersion: apps/v1
kind: Deployment
metadata:
  name: cricket-redis
  namespace: cricket-game
  labels:
    app: cricket-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cricket-redis
  template:
    metadata:
      labels:
        app: cricket-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          command:
            - sh
            - -c
            - |
              redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cricket-backend-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: cricket-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cricket-redis-service
  namespace: cricket-game
  labels:
    app: cricket-redis
spec:
  type: ClusterIP
  selector:
    app: cricket-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cricket-redis-pvc
  namespace: cricket-game
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ibmc-file-bronze  # IBM Cloud File Storage