apiVersion: v1
kind: Service
metadata:
  name: cricket-backend-service
  namespace: cricket-game
  labels:
    app: cricket-backend
spec:
  type: ClusterIP
  selector:
    app: cricket-backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours — important for Socket.IO sticky sessions