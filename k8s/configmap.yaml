apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: cricket-backend
data:
  PORT: "3000"
  NODE_ENV: "production"
  CORS_ORIGIN: "*"
  REDIS_URL: "redis://redis-service:6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: cricket-backend
data:
  REDIS_PORT: "6379"