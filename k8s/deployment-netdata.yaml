# Updated deployment with Netdata sidecar
# Run: kubectl apply -f deployment-netdata.yaml -n cricket-game

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cricket-backend
  namespace: cricket-game
  labels:
    app: cricket-backend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cricket-backend
  template:
    metadata:
      labels:
        app: cricket-backend
        version: v1
    spec:
      imagePullSecrets:
        - name: icr-io-creds
      containers:
        - name: cricket-backend
          image: us.icr.io/cricket-game/cricket-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cricket-backend-config
            - secretRef:
                name: cricket-backend-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
        
        # Netdata sidecar for real-time monitoring
        - name: netdata
          image: netdata/netdata:v1.37.1
          imagePullPolicy: Always
          ports:
            - containerPort: 19999
              name: netdata
              protocol: TCP
          env:
            - name: NETDATA_CLAIM_TOKEN
              value: ""  # Add your Netdata Cloud claim token
            - name: NETDATA_CLAIM_URL
              value: "https://app.netdata.cloud"
            - name: NETDATA_CLAIM_ROOMS
              value: ""  # Add room IDs for team access
            - name: NETDATA_WANTED_TABLES
              value: "netdata"
            - name: NETDATA_CLAIM_DISABLE
              value: "true"
          resources:
            requests:
              cpu: "50m"
              memory: "50Mi"
            limits:
              cpu: "200m"
              memory: "150Mi"
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: netdata-config
              mountPath: /etc/netdata
            - name: netdata-lib
              mountPath: /var/lib/netdata
            - name: netdata-cache
              mountPath: /var/cache/netdata
          livenessProbe:
            httpGet:
              path: /api/v1/info
              port: 19999
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/info
              port: 19999
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsUser: 201
            runAsGroup: 201
            capabilities:
              add:
                - SYS_PTRACE
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
      securityContext:
        fsGroup: 201
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: netdata-config
          configMap:
            name: netdata-config
        - name: netdata-lib
          emptyDir: {}
        - name: netdata-cache
          emptyDir: {}