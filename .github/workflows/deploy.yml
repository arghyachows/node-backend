name: Deploy Backend to OCI

on:
  push:
    branches: [ "master", "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: arghyachows/cricket-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,enable=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM 1 (Primary)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          script: |
            cd node-backend
            
            # Pull latest git changes to ensure compose configuration matches
            git pull origin master
            
            # Log in to registry on VM (uses github token to pull)
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Pull new image version
            sudo docker compose pull backend
            
            # Restart containers
            sudo docker compose up -d
            
            # Clean up old/dangling Docker images to save space
            sudo docker image prune -f

      - name: Deploy to VM 2 (Secondary)
        uses: appleboy/ssh-action@v1.0.3
        if: "${{ secrets.OCI_HOST_2 != '' }}"
        with:
          host: ${{ secrets.OCI_HOST_2 }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          script: |
            cd node-backend
            
            # Pull latest git changes to ensure compose configuration matches
            git pull origin master
            
            # Log in to registry on VM (uses github token to pull)
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Pull new image version
            sudo docker compose pull backend
            
            # Restart containers
            sudo docker compose up -d
            
            # Clean up old/dangling Docker images to save space
            sudo docker image prune -f
